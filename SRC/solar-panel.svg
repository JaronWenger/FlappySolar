  <line x1="20" y1="205" x2="20" y2="235" stroke="#333333" stroke-width="1"/>
  <line x1="35" y1="205" x2="35" y2="235" stroke="#333333" stroke-width="1"/>
  <line x1="20" y1="245" x2="20" y2="275" stroke="#333333" stroke-width="1"/>
  <line x1="35" y1="245" x2="35" y2="275" stroke="#333333" stroke-width="1"/>
  <line x1="20" y1="285" x2="20" y2="315" stroke="#333333" stroke-width="1"/>

<?xml version="1.0" encoding="UTF-8"?>
<svg width="60" height="320" viewBox="0 0 60 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Solar panel frame -->
  <rect x="0" y="0" width="60" height="320" fill="#333333" stroke="#000000" stroke-width="2"/>
  
  <!-- Solar cells -->
  <rect x="5" y="5" width="50" height="30" fill="#000000"/>
  <rect x="5" y="45" width="50" height="30" fill="#000000"/>
  <rect x="5" y="85" width="50" height="30" fill="#000000"/>
  <rect x="5" y="125" width="50" height="30" fill="#000000"/>
  <rect x="5" y="165" width="50" height="30" fill="#000000"/>
  <rect x="5" y="205" width="50" height="30" fill="#000000"/>
  <rect x="5" y="245" width="50" height="30" fill="#000000"/>
  <rect x="5" y="285" width="50" height="30" fill="#000000"/>
  
  <!-- Solar cell grid lines -->
  <line x1="5" y1="20" x2="55" y2="20" stroke="#333333" stroke-width="1"/>
  <line x1="5" y1="60" x2="55" y2="60" stroke="#333333" stroke-width="1"/>
  <line x1="5" y1="100" x2="55" y2="100" stroke="#333333" stroke-width="1"/>
  <line x1="5" y1="140" x2="55" y2="140" stroke="#333333" stroke-width="1"/>

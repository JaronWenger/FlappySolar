  <line x1="5" y1="300" x2="55" y2="300" stroke="#333333" stroke-width="1"/>
  
  <!-- Solar cell vertical lines -->
  <line x1="20" y1="5" x2="20" y2="35" stroke="#333333" stroke-width="1"/>
  <line x1="35" y1="5" x2="35" y2="35" stroke="#333333" stroke-width="1"/>
  <line x1="20" y1="45" x2="20" y2="75" stroke="#333333" stroke-width="1"/>
  <line x1="35" y1="45" x2="35" y2="75" stroke="#333333" stroke-width="1"/>
  <line x1="20" y1="85" x2="20" y2="115" stroke="#333333" stroke-width="1"/>
